name: Reader sample checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install declared Python dependencies
        run: python -m pip install -r entra\requirements.txt
      - name: Python offline boundary and privacy checks
        working-directory: entra
        run: python -B -m unittest -v
      - name: Node syntax checks
        working-directory: keycloak
        run: npm run check --silent
      - name: Node offline ownership and JWT checks
        working-directory: keycloak
        run: npm run test:unit --silent
      - name: PowerShell parser and dry run
        shell: powershell
        run: |
          $errors = @()
          $tokens = @()
          foreach ($file in Get-ChildItem scripts\*.ps1) {
            $null = [Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count) { throw "PowerShell parser failure: $($file.Name)" }
          }
          .\scripts\lab.ps1 -Action EntraRun -WhatIf
